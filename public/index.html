<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MediCare Clinic — Live Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F2;
    --surface: #FFFFFF;
    --border: #E2E0D8;
    --text: #1A1918;
    --muted: #787672;
    --green-bg: #EAF3DE; --green: #3B6D11;
    --amber-bg: #FAEEDA; --amber: #854F0B;
    --blue-bg:  #E6F1FB; --blue:  #185FA5;
    --gray-bg:  #F1EFE8; --gray:  #5F5E5A;
    --red-bg:   #FCEBEB; --red:   #A32D2D;
    --font: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
    --radius: 10px;
  }

  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Layout ── */
  .app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; overflow: hidden; }
  .main { display: grid; grid-template-columns: 1fr 340px; overflow: hidden; gap: 0; }

  /* ── Top Bar ── */
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .logo span { color: var(--muted); font-weight: 400; }
  .ws-badge {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: var(--gray-bg); color: var(--gray);
    display: flex; align-items: center; gap: 5px;
  }
  .ws-badge.connected { background: var(--green-bg); color: var(--green); }
  .ws-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ws-badge.connected .ws-dot { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.3} }
  .topbar-right { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  #current-time { font-family: var(--mono); font-size: 13px; }

  /* ── Left panel ── */
  .left-panel { display: flex; flex-direction: column; overflow: hidden; padding: 20px 24px; gap: 16px; overflow-y: auto; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .metric { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .metric-val { font-size: 26px; font-weight: 600; }
  .metric-val.blue { color: var(--blue); }
  .metric-val.green { color: var(--green); }
  .metric-val.amber { color: var(--amber); }

  /* ── Appointments table ── */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .table-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .table-head h2 { font-size: 14px; font-weight: 600; }
  .filters { display: flex; gap: 4px; }
  .filt { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--muted); font-family: var(--font); }
  .filt.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 18px; text-align: left; border-bottom: 1px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--bg); }
  tbody tr.flash { animation: rowflash 1.8s ease; }
  @keyframes rowflash { 0%{background:#EAF3DE}100%{background:transparent} }
  td { padding: 12px 18px; font-size: 13px; vertical-align: middle; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .patient-cell { display: flex; align-items: center; gap: 10px; }
  .patient-name { font-weight: 500; }
  .patient-phone { font-size: 11px; color: var(--muted); }
  .time-cell { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
  .b-confirmed { background: var(--green-bg); color: var(--green); }
  .b-waiting   { background: var(--amber-bg); color: var(--amber); }
  .b-done      { background: var(--gray-bg);  color: var(--gray); }
  .b-cancelled { background: var(--red-bg);   color: var(--red); }
  .action-btn { font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--muted); font-family: var(--font); margin-right: 4px; }
  .action-btn:hover { background: var(--bg); color: var(--text); }
  .empty-row td { text-align: center; padding: 2.5rem; color: var(--muted); font-size: 13px; }

  /* ── Right panel: AI log ── */
  .right-panel { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .rp-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .rp-head h3 { font-size: 14px; font-weight: 600; }
  .rp-head p { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .log-area { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .log-item { padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.55; }
  .log-item.info    { background: var(--blue-bg);  color: #0C447C; }
  .log-item.success { background: var(--green-bg); color: #3B6D11; }
  .log-item.warning { background: var(--amber-bg); color: #633806; }
  .log-item.error   { background: var(--red-bg);   color: #791F1F; }
  .log-item.system  { background: var(--gray-bg);  color: var(--muted); }
  .log-time { font-family: var(--mono); font-size: 10px; opacity: 0.6; margin-top: 4px; }

  .rp-footer { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .rp-footer label { font-size: 11px; color: var(--muted); }
  .rp-input-row { display: flex; gap: 6px; }
  .rp-input { flex: 1; font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: var(--font); outline: none; }
  .rp-input:focus { border-color: #888; }
  .rp-btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--text); color: var(--bg); cursor: pointer; font-size: 13px; font-family: var(--font); }
  .rp-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">MediCare Clinic <span>/ Live Dashboard</span></div>
      <div class="ws-badge" id="ws-badge">
        <div class="ws-dot"></div>
        <span id="ws-label">Connecting…</span>
      </div>
    </div>
    <div class="topbar-right">
      <span id="current-time">--:--:--</span>
    </div>
  </div>

  <div class="main">

    <!-- Left: appointments -->
    <div class="left-panel">

      <!-- Metrics -->
      <div class="metrics">
        <div class="metric">
          <div class="metric-label">Total today</div>
          <div class="metric-val blue" id="m-total">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Confirmed</div>
          <div class="metric-val green" id="m-confirmed">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Waiting</div>
          <div class="metric-val amber" id="m-waiting">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">Done</div>
          <div class="metric-val" id="m-done">—</div>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card">
        <div class="table-head">
          <h2>Appointments — <span id="date-label"></span></h2>
          <div class="filters">
            <button class="filt on" onclick="setFilter('all',this)">All</button>
            <button class="filt" onclick="setFilter('confirmed',this)">Confirmed</button>
            <button class="filt" onclick="setFilter('waiting',this)">Waiting</button>
            <button class="filt" onclick="setFilter('done',this)">Done</button>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Patient</th>
              <th>Time</th>
              <th>Doctor</th>
              <th>Type</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appt-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Right: Vapi AI log -->
    <div class="right-panel">
      <div class="rp-head">
        <h3>Vapi receptionist log</h3>
        <p>Real-time updates from your AI agent</p>
      </div>
      <div class="log-area" id="log-area"></div>
      <div class="rp-footer">
        <label>Manual test command</label>
        <div class="rp-input-row">
          <input class="rp-input" id="test-input" placeholder="e.g. book Amit at 3pm with Dr. Singh" onkeydown="if(event.key==='Enter')sendTest()" />
          <button class="rp-btn" onclick="sendTest()">Send</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const AVATAR_COLORS = [
  ['#B5D4F4','#0C447C'], ['#9FE1CB','#085041'], ['#F5C4B3','#993C1D'],
  ['#F4C0D1','#72243E'], ['#FAC775','#633806'], ['#C0DD97','#27500A'],
];

let appointments = [];
let filter = 'all';
let ws;

// ── WebSocket connection ──────────────────────────────────────────────────────
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = () => {
    setBadge(true);
    addLog('system', 'Connected to clinic server. Waiting for Vapi events…');
  };

  ws.onmessage = (e) => {
    const { event, data } = JSON.parse(e.data);
    handleEvent(event, data);
  };

  ws.onclose = () => {
    setBadge(false);
    addLog('error', 'Connection lost. Reconnecting in 3s…');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => ws.close();
}

function handleEvent(event, data) {
  switch (event) {
    case 'init':
      appointments = data;
      render();
      addLog('info', `Loaded ${data.length} appointment(s) from database.`);
      break;
    case 'appointment_booked':
      appointments.push(data);
      render();
      flashRow(data.id);
      addLog('success', `Booked: ${data.patient_name} at ${data.time} with ${data.doctor}`);
      updateMetrics();
      break;
    case 'appointment_cancelled':
      appointments = appointments.map(a => a.id === data.id ? { ...a, status: 'cancelled' } : a);
      render();
      addLog('warning', `Cancelled: appointment #${data.id}`);
      updateMetrics();
      break;
    case 'appointment_rescheduled':
    case 'appointment_updated':
      appointments = appointments.map(a => a.id === data.id ? data : a);
      render();
      flashRow(data.id);
      addLog('success', `Updated: ${data.patient_name} → ${data.time}`);
      updateMetrics();
      break;
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const tbody = document.getElementById('appt-tbody');
  let visible = appointments.filter(a => a.status !== 'cancelled');
  if (filter !== 'all') visible = visible.filter(a => a.status === filter);
  visible.sort((a, b) => a.time.localeCompare(b.time));

  if (!visible.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No appointments found.</td></tr>';
    return;
  }

  tbody.innerHTML = visible.map((a, i) => {
    const [bg, fg] = AVATAR_COLORS[i % AVATAR_COLORS.length];
    const initials = a.patient_name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
    return `
      <tr id="row-${a.id}">
        <td>
          <div class="patient-cell">
            <div class="avatar" style="background:${bg};color:${fg}">${initials}</div>
            <div>
              <div class="patient-name">${a.patient_name}</div>
              ${a.phone ? `<div class="patient-phone">${a.phone}</div>` : ''}
            </div>
          </div>
        </td>
        <td><span class="time-cell">${a.time}</span></td>
        <td>${a.doctor}</td>
        <td>${a.appointment_type}</td>
        <td><span class="badge b-${a.status}">${capitalize(a.status)}</span></td>
        <td>
          <button class="action-btn" onclick="markDone(${a.id})">Done</button>
          <button class="action-btn" onclick="cancelAppt(${a.id})">Cancel</button>
        </td>
      </tr>
    `;
  }).join('');

  updateMetrics();
}

function updateMetrics() {
  const active = appointments.filter(a => a.status !== 'cancelled');
  document.getElementById('m-total').textContent     = active.length;
  document.getElementById('m-confirmed').textContent = active.filter(a => a.status === 'confirmed').length;
  document.getElementById('m-waiting').textContent   = active.filter(a => a.status === 'waiting').length;
  document.getElementById('m-done').textContent      = active.filter(a => a.status === 'done').length;
}

function flashRow(id) {
  setTimeout(() => {
    const row = document.getElementById(`row-${id}`);
    if (row) { row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1800); }
  }, 50);
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filt').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

// ── Log panel ─────────────────────────────────────────────────────────────────
function addLog(type, text) {
  const el = document.getElementById('log-area');
  const div = document.createElement('div');
  div.className = `log-item ${type}`;
  div.innerHTML = `${text}<div class="log-time">${new Date().toLocaleTimeString()}</div>`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function markDone(id) {
  await fetch(`/api/appointments/${id}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'done' }),
  });
}

async function cancelAppt(id) {
  if (!confirm('Cancel this appointment?')) return;
  await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
}

async function sendTest() {
  const inp = document.getElementById('test-input');
  const val = inp.value.trim();
  if (!val) return;
  inp.value = '';
  addLog('info', `Test command: "${val}"`);

  // Simulate a Vapi tool call to our own endpoint
  const res = await fetch('/vapi/webhook', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: {
        type: 'tool-calls',
        toolCallList: [{
          id: 'test-' + Date.now(),
          function: parseCommand(val),
        }]
      }
    }),
  });
  const data = await res.json();
  const result = data.results?.[0]?.result;
  if (result) {
    try { const r = JSON.parse(result); addLog(r.success ? 'success' : 'error', r.message); }
    catch { addLog('info', result); }
  }
}

function parseCommand(cmd) {
  const lower = cmd.toLowerCase();
  if (lower.includes('book') || lower.includes('add') || lower.includes('schedule')) {
    const nameMatch = cmd.match(/(?:book|add|schedule)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/i);
    const timeMatch = cmd.match(/(?:at\s+)?(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/i);
    const doctorMatch = cmd.match(/(?:with\s+)?(Dr\.?\s+[A-Z][a-z]+)/i);
    return {
      name: 'book_appointment',
      arguments: {
        patient_name: nameMatch ? nameMatch[1] : 'Test Patient',
        time: timeMatch ? timeMatch[1] : '10:00',
        doctor: doctorMatch ? doctorMatch[1] : 'Dr. Mehta',
        date: new Date().toISOString().split('T')[0],
      }
    };
  } else if (lower.includes('cancel')) {
    const nameMatch = cmd.match(/cancel\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/i);
    return { name: 'cancel_appointment', arguments: { patient_name: nameMatch ? nameMatch[1] : '' } };
  } else if (lower.includes('reschedule') || lower.includes('move')) {
    const nameMatch = cmd.match(/(?:reschedule|move)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/i);
    const timeMatch = cmd.match(/to\s+(\d{1,2}(?::\d{2})?\s*(?:am|pm)?)/i);
    return {
      name: 'reschedule_appointment',
      arguments: { patient_name: nameMatch ? nameMatch[1] : '', new_time: timeMatch ? timeMatch[1] : '' }
    };
  }
  return { name: 'get_appointments', arguments: { date: new Date().toISOString().split('T')[0] } };
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function setBadge(connected) {
  const badge = document.getElementById('ws-badge');
  const label = document.getElementById('ws-label');
  badge.className = 'ws-badge' + (connected ? ' connected' : '');
  label.textContent = connected ? 'Live' : 'Disconnected';
}

// ── Clock ─────────────────────────────────────────────────────────────────────
function updateClock() {
  document.getElementById('current-time').textContent = new Date().toLocaleTimeString('en-IN');
}
setInterval(updateClock, 1000);
updateClock();

document.getElementById('date-label').textContent = new Date().toLocaleDateString('en-IN', {
  weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
});

// ── Boot ──────────────────────────────────────────────────────────────────────
connectWS();
</script>
</body>
</html>
